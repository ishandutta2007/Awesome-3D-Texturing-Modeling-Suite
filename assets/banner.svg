<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="poly-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="poly-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="wireframe-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
    </pattern>

    <!-- Isometric 3D Grid Pattern -->
    <pattern id="iso-grid" width="60" height="103.92" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 51.96 L 30 103.92 L 0 51.96 Z M 30 0 L 30 103.92 M 0 51.96 L 60 51.96" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.25" />
    </pattern>

    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .gradient-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primary-glow);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #64748b;
    }

    /* Ambient Dynamic Pulsing */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes pulseMesh {
      0%, 100% { opacity: 0.4; transform: rotate(0deg) scale(1); }
      50% { opacity: 0.75; transform: rotate(180deg) scale(1.05); }
    }
    @keyframes scanlineMove {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    .ambient-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 950px 180px;
    }
    .ambient-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 150px 100px;
    }
    .wireframe-cube {
      animation: floatCube 6s ease-in-out infinite;
      transform-origin: 1000px 210px;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 4s linear infinite;
    }
  </style>

  <!-- Deep Workspace Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Background Grids -->
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="700" y="0" width="500" height="420" fill="url(#iso-grid)" opacity="0.7" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="ambient-orb-2" cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow-blur)" opacity="0.25" />
  <circle class="ambient-orb-1" cx="980" cy="190" r="180" fill="#818cf8" filter="url(#glow-blur)" opacity="0.35" />
  <circle cx="1060" cy="280" r="120" fill="#ec4899" filter="url(#glow-blur)" opacity="0.2" />

  <!-- Dynamic Geometric Isometric Mesh (Background Right) -->
  <g class="wireframe-cube">
    <!-- Outer 3D Hexagonal Prism / Crystal Mesh -->
    <polygon points="1000,70 1130,145 1130,295 1000,370 870,295 870,145" fill="url(#poly-grad-1)" stroke="url(#wireframe-glow)" stroke-width="1.5" />
    <polygon points="1000,70 1000,220 870,295 870,145" fill="url(#poly-grad-2)" stroke="#38bdf8" stroke-width="1" opacity="0.7" />
    <polygon points="1000,70 1130,145 1130,295 1000,220" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.6" />
    <polygon points="1000,220 1130,295 1000,370 870,295" fill="#0f172a" fill-opacity="0.4" stroke="#c084fc" stroke-width="1" opacity="0.7" />

    <!-- Inner Polyhedral Subdivision Facets -->
    <line x1="1000" y1="70" x2="1000" y2="370" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
    <line x1="870" y1="145" x2="1130" y2="295" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    <line x1="870" y1="295" x2="1130" y2="145" stroke="#ec4899" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

    <!-- 3D Vertices (Glowing Nodes) -->
    <circle cx="1000" cy="70" r="5" fill="#38bdf8" filter="url(#subtle-glow)" />
    <circle cx="1130" cy="145" r="5" fill="#818cf8" filter="url(#subtle-glow)" />
    <circle cx="1130" cy="295" r="5" fill="#c084fc" filter="url(#subtle-glow)" />
    <circle cx="1000" cy="370" r="5" fill="#ec4899" filter="url(#subtle-glow)" />
    <circle cx="870" cy="295" r="5" fill="#38bdf8" filter="url(#subtle-glow)" />
    <circle cx="870" cy="145" r="5" fill="#818cf8" filter="url(#subtle-glow)" />
    <circle cx="1000" cy="220" r="6" fill="#ffffff" filter="url(#subtle-glow)" />
  </g>

  <!-- Dynamic Data Stream Accent Lines -->
  <line x1="720" y1="120" x2="870" y2="145" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.6" />
  <line x1="740" y1="260" x2="870" y2="220" stroke="#818cf8" stroke-width="1.5" class="flow-line" opacity="0.6" />
  <line x1="700" y1="340" x2="870" y2="295" stroke="#c084fc" stroke-width="1.5" class="flow-line" opacity="0.6" />

  <!-- Clean Top Status Badge -->
  <g transform="translate(80, 56)">
    <rect width="265" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="badge-text">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Foreground Main Headings (Guaranteed High Contrast & Prominence) -->
  <!-- Header Title -->
  <g transform="translate(80, 150)">
    <text x="0" y="0" class="title-text">Awesome </text>
    <text x="210" y="0" class="gradient-text">3D Texturing &amp; Modeling</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="200" class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Creative Ecosystem</text>

  <!-- Dynamic Feature Tags / Pills -->
  <g transform="translate(80, 245)">
    <!-- Pill 1: Modeling & Sculpting -->
    <rect x="0" y="0" width="180" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Modeling &amp; Sculpting</text>

    <!-- Pill 2: PBR Texturing -->
    <rect x="195" y="0" width="145" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" />
    <circle cx="215" cy="19" r="4" fill="#818cf8" />
    <text x="229" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">PBR Texturing</text>

    <!-- Pill 3: Real-Time Pipelines -->
    <rect x="355" y="0" width="185" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
    <circle cx="375" cy="19" r="4" fill="#c084fc" />
    <text x="389" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Real-Time Pipelines</text>

    <!-- Pill 4: Open-Source Suites -->
    <rect x="555" y="0" width="175" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" />
    <circle cx="575" cy="19" r="4" fill="#10b981" />
    <text x="589" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Open-Source Suites</text>
  </g>

  <!-- Tagline / Bottom Bar -->
  <g transform="translate(80, 335)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="32" class="tagline-text">Comprehensive comparison of pricing, commercial licensing, free tiers &amp; GitHub repos</text>
  </g>
</svg>
